<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sửa thông tin hóa đơn mua vào</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><h1 data-node-id="title_invoice" data-node-type="Heading" class="ds-h ds-h1">Sửa hóa đơn 0012345</h1><form data-node-id="invoice_form" data-node-type="Form" class="ds-form"><div data-node-id="two_cols" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="header_col" data-node-type="Column" class="ds-col ds-w-auto" style="gap:12px"><div data-node-id="input_number" data-node-type="Input" class="ds-field"><div class="ds-label">Số hóa đơn<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="date_invoice" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày hóa đơn<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div><div data-node-id="select_supplier" data-node-type="Select" class="ds-field"><div class="ds-label">Nhà cung cấp<span class="ds-req">*</span></div><div class="ds-input"><span>Công ty Thép Việt</span><span class="ds-ico">▾</span></div></div><div data-node-id="select_vat" data-node-type="Select" class="ds-field"><div class="ds-label">Thuế suất<span class="ds-req">*</span></div><div class="ds-input"><span>0%</span><span class="ds-ico">▾</span></div></div></div><div data-node-id="lines_col" data-node-type="Column" class="ds-col ds-w-auto" style="gap:12px"><div data-node-id="table_lines" data-node-type="Table" class="ds-table-wrap"><table class="ds-table"><thead><tr><th>Hàng hóa</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th>Thao tác</th></tr></thead><tbody><tr><td>Thép cuộn D10</td><td>5 tấn</td><td>16.500.000</td><td>82.500.000</td><td class="ds-row-acts"><span class="ds-link">Sửa</span><span class="ds-link">Xóa</span></td></tr></tbody></table></div><div data-node-id="stat_total" data-node-type="Stat" class="ds-stat"><div class="ds-stat-label">Tổng thanh toán</div><div class="ds-stat-value">89.100.000 đ</div></div></div></div><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_delete" data-node-type="Button" role="button" class="ds-btn ds-btn-danger">Xóa hóa đơn</span><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_save" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Lưu</span></div></form></div></body></html>
