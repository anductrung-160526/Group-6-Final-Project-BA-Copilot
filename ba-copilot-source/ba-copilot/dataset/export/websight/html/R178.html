<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo hồ sơ ứng viên</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><div data-node-id="candidate_card" data-node-type="Card" class="ds-card"><div class="ds-card-title">Hồ sơ ứng viên mới</div><form data-node-id="candidate_form" data-node-type="Form" class="ds-form"><div data-node-id="input_fullname" data-node-type="Input" class="ds-field"><div class="ds-label">Họ tên<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="contact_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="input_email" data-node-type="Input" class="ds-field"><div class="ds-label">Email<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_phone" data-node-type="Input" class="ds-field"><div class="ds-label">Điện thoại</div><div class="ds-input"><span class="ds-ph"></span></div></div></div><div data-node-id="job_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="select_position" data-node-type="Select" class="ds-field"><div class="ds-label">Vị trí ứng tuyển<span class="ds-req">*</span></div><div class="ds-input"><span>Kế toán</span><span class="ds-ico">▾</span></div></div><div data-node-id="select_source" data-node-type="Select" class="ds-field"><div class="ds-label">Nguồn</div><div class="ds-input"><span>Website</span><span class="ds-ico">▾</span></div></div></div><div data-node-id="date_applied" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày ứng tuyển</div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div><div data-node-id="ta_note" data-node-type="Textarea" class="ds-field"><div class="ds-label">Ghi chú</div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_create" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Tạo hồ sơ</span></div></form></div></div></body></html>
