<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo ticket hỗ trợ (hộp thoại)</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><div data-node-id="head_row" data-node-type="Row" class="ds-row ds-align-between" style="gap:8px"><h1 data-node-id="title_tickets" data-node-type="Heading" class="ds-h ds-h1">Ticket của tôi</h1><span data-node-id="btn_new" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">+ Gửi ticket</span></div><div data-node-id="table_tickets" data-node-type="Table" class="ds-table-wrap"><table class="ds-table"><thead><tr><th>Mã</th><th>Tiêu đề</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr><td>TK-24051</td><td>Không đăng nhập được</td><td>Đang xử lý</td><td class="ds-row-acts"><span class="ds-link">Xem</span></td></tr></tbody></table></div><div data-node-id="create_modal" data-node-type="Modal" class="ds-modal"><div class="ds-modal-head">Gửi ticket mới</div><form data-node-id="ticket_form" data-node-type="Form" class="ds-form"><div data-node-id="cat_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="select_category" data-node-type="Select" class="ds-field"><div class="ds-label">Danh mục<span class="ds-req">*</span></div><div class="ds-input"><span>Tài khoản</span><span class="ds-ico">▾</span></div></div><div data-node-id="select_severity" data-node-type="Select" class="ds-field"><div class="ds-label">Mức độ</div><div class="ds-input"><span>Thấp</span><span class="ds-ico">▾</span></div></div></div><div data-node-id="input_title" data-node-type="Input" class="ds-field"><div class="ds-label">Tiêu đề<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="ta_desc" data-node-type="Textarea" class="ds-field"><div class="ds-label">Mô tả<span class="ds-req">*</span></div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div><div data-node-id="input_order" data-node-type="Input" class="ds-field"><div class="ds-label">Mã đơn hàng liên quan</div><div class="ds-input"><span class="ds-ph">Không bắt buộc</span></div></div><div data-node-id="modal_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_submit" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Gửi ticket</span></div></form></div></div></body></html>
