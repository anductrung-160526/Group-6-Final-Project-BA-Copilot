<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo tích hợp hệ thống mới – nhiều phần</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><div data-node-id="integration_card" data-node-type="Card" class="ds-card"><div class="ds-card-title">Tạo tích hợp mới</div><form data-node-id="integration_form" data-node-type="Form" class="ds-form"><section data-node-id="sec_general" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Thông tin chung</h3><div data-node-id="input_name" data-node-type="Input" class="ds-field"><div class="ds-label">Tên tích hợp<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="select_system" data-node-type="Select" class="ds-field"><div class="ds-label">Hệ thống<span class="ds-req">*</span></div><div class="ds-input"><span>ERP SAP</span><span class="ds-ico">▾</span></div></div></section><section data-node-id="sec_auth" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Xác thực</h3><div data-node-id="input_url" data-node-type="Input" class="ds-field"><div class="ds-label">URL endpoint<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">https://</span></div></div><div data-node-id="input_key" data-node-type="Input" class="ds-field"><div class="ds-label">Khóa API<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">••••••••</span></div></div></section><section data-node-id="sec_schedule" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Lịch đồng bộ</h3><div data-node-id="radio_freq" data-node-type="Radio" class="ds-field"><div class="ds-label">Tần suất</div><div class="ds-radios"><span class="ds-check"><span class="ds-radio on"></span>15 phút</span><span class="ds-check"><span class="ds-radio "></span>1 giờ</span><span class="ds-check"><span class="ds-radio "></span>Hàng ngày</span></div></div></section><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_test" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Kiểm tra kết nối</span><span data-node-id="btn_create" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Tạo tích hợp</span></div></form></div></div></body></html>
