<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký tài khoản bệnh nhân</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><aside data-node-id="nav_guide" data-node-type="Sidebar" class="ds-sidebar"><a data-node-id="nav_why" data-node-type="Link" href="#" class="ds-link">Lợi ích tài khoản</a><a data-node-id="nav_privacy" data-node-type="Link" href="#" class="ds-link">Chính sách bảo mật</a><a data-node-id="nav_login" data-node-type="Link" href="#" class="ds-link">Đăng nhập</a></aside><form data-node-id="register_form" data-node-type="Form" class="ds-form"><div class="ds-form-title">Đăng ký tài khoản bệnh nhân</div><div data-node-id="input_fullname" data-node-type="Input" class="ds-field"><div class="ds-label">Họ tên<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="dob_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="date_dob" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày sinh<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div><div data-node-id="radio_gender" data-node-type="Radio" class="ds-field"><div class="ds-label">Giới tính</div><div class="ds-radios"><span class="ds-check"><span class="ds-radio on"></span>Nam</span><span class="ds-check"><span class="ds-radio "></span>Nữ</span><span class="ds-check"><span class="ds-radio "></span>Khác</span></div></div></div><div data-node-id="input_phone" data-node-type="Input" class="ds-field"><div class="ds-label">Số điện thoại<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_insurance" data-node-type="Input" class="ds-field"><div class="ds-label">Mã BHYT</div><div class="ds-input"><span class="ds-ph">Không bắt buộc</span></div></div><div data-node-id="input_password" data-node-type="Input" class="ds-field"><div class="ds-label">Mật khẩu<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">••••••••</span></div></div><div data-node-id="cb_terms" data-node-type="Checkbox" class="ds-check"><span class="ds-box"></span>Tôi đồng ý với chính sách bảo mật</div><span data-node-id="btn_register" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Đăng ký</span></form></div></body></html>
