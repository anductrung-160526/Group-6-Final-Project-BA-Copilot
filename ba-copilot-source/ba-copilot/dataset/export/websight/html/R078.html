<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cập nhật hồ sơ doanh nghiệp của tôi – nhiều phần</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><h1 data-node-id="title_profile" data-node-type="Heading" class="ds-h ds-h1">Hồ sơ doanh nghiệp</h1><form data-node-id="company_form" data-node-type="Form" class="ds-form"><section data-node-id="sec_legal" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Thông tin pháp lý</h3><div data-node-id="input_company" data-node-type="Input" class="ds-field"><div class="ds-label">Tên công ty<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_tax" data-node-type="Input" class="ds-field"><div class="ds-label">Mã số thuế<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div></section><section data-node-id="sec_contact" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Người liên hệ</h3><div data-node-id="contact_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="input_contact" data-node-type="Input" class="ds-field"><div class="ds-label">Họ tên<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_contact_email" data-node-type="Input" class="ds-field"><div class="ds-label">Email<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div></div><div data-node-id="input_contact_phone" data-node-type="Input" class="ds-field"><div class="ds-label">Điện thoại</div><div class="ds-input"><span class="ds-ph"></span></div></div></section><section data-node-id="sec_billing" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Địa chỉ xuất hóa đơn</h3><div data-node-id="ta_address" data-node-type="Textarea" class="ds-field"><div class="ds-label">Địa chỉ<span class="ds-req">*</span></div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div><div data-node-id="select_province" data-node-type="Select" class="ds-field"><div class="ds-label">Tỉnh/Thành phố<span class="ds-req">*</span></div><div class="ds-input"><span>Hà Nội</span><span class="ds-ico">▾</span></div></div></section><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_save" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Lưu hồ sơ</span></div></form></div></body></html>
