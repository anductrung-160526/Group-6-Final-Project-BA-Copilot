<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo khóa học mới – nhiều phần</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><aside data-node-id="nav_lms" data-node-type="Sidebar" class="ds-sidebar"><a data-node-id="nav_courses" data-node-type="Link" href="#" class="ds-link">Khóa học</a><a data-node-id="nav_teachers" data-node-type="Link" href="#" class="ds-link">Giảng viên</a><a data-node-id="nav_classes" data-node-type="Link" href="#" class="ds-link">Lớp học</a></aside><form data-node-id="course_form" data-node-type="Form" class="ds-form"><div class="ds-form-title">Tạo khóa học</div><section data-node-id="sec_general" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Thông tin chung</h3><div data-node-id="input_name" data-node-type="Input" class="ds-field"><div class="ds-label">Tên khóa học<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="ta_desc" data-node-type="Textarea" class="ds-field"><div class="ds-label">Mô tả</div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div></section><section data-node-id="sec_schedule" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Lịch học</h3><div data-node-id="date_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="date_start" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày bắt đầu<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div><div data-node-id="date_end" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày kết thúc<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div></div><div data-node-id="input_sessions" data-node-type="Input" class="ds-field"><div class="ds-label">Số buổi<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div></section><section data-node-id="sec_fee" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Học phí &amp; giảng viên</h3><div data-node-id="input_fee" data-node-type="Input" class="ds-field"><div class="ds-label">Học phí (đ)</div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="select_teacher" data-node-type="Select" class="ds-field"><div class="ds-label">Giảng viên<span class="ds-req">*</span></div><div class="ds-input"><span>Nguyễn Hoàng Long</span><span class="ds-ico">▾</span></div></div></section><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_save" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Tạo khóa học</span></div></form></div></body></html>
