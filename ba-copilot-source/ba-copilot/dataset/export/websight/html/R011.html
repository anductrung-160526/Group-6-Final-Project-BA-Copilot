<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập – kênh người bán sàn thương mại điện tử</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><h1 data-node-id="login_heading" data-node-type="Heading" class="ds-h ds-h1">Đăng nhập Kênh Người Bán</h1><p data-node-id="login_subtitle" data-node-type="Text" class="ds-text ">Quản lý sản phẩm, đơn hàng và doanh thu shop của bạn.</p><form data-node-id="login_form" data-node-type="Form" class="ds-form"><div data-node-id="input_account" data-node-type="Input" class="ds-field"><div class="ds-label">Email hoặc số điện thoại<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">VD: shop@gmail.com hoặc 0901234567</span></div></div><div data-node-id="input_password" data-node-type="Input" class="ds-field"><div class="ds-label">Mật khẩu<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph">••••••••</span></div></div><div data-node-id="login_options" data-node-type="Row" class="ds-row ds-align-center" style="gap:12px"><div data-node-id="chk_remember" data-node-type="Checkbox" class="ds-check"><span class="ds-box"></span>Ghi nhớ đăng nhập</div><a data-node-id="link_forgot" data-node-type="Link" href="#" class="ds-link">Quên mật khẩu?</a></div><span data-node-id="btn_login" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Đăng nhập</span></form><div data-node-id="register_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:4px"><p data-node-id="register_prompt" data-node-type="Text" class="ds-text ">Chưa có shop?</p><a data-node-id="link_register" data-node-type="Link" href="#" class="ds-link">Đăng ký bán hàng</a></div></div></body></html>
