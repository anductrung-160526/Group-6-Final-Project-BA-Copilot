<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồ sơ học viên</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><div data-node-id="profile_card" data-node-type="Card" class="ds-card"><div class="ds-card-title">Hồ sơ của tôi</div><div data-node-id="avatar_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><span data-node-id="avatar" data-node-type="Avatar" class="ds-avatar" title="Phạm Thu Trang">T</span><div data-node-id="avatar_info" data-node-type="Column" class="ds-col ds-w-auto" style="gap:12px"><p data-node-id="email_text" data-node-type="Text" class="ds-text ds-muted">trang.pham@gmail.com</p><a data-node-id="link_change_avatar" data-node-type="Link" href="#" class="ds-link">Đổi ảnh đại diện</a></div></div><form data-node-id="profile_form" data-node-type="Form" class="ds-form"><div data-node-id="input_fullname" data-node-type="Input" class="ds-field"><div class="ds-label">Họ tên<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_phone" data-node-type="Input" class="ds-field"><div class="ds-label">Số điện thoại</div><div class="ds-input"><span class="ds-ph">09xxxxxxxx</span></div></div><div data-node-id="select_job" data-node-type="Select" class="ds-field"><div class="ds-label">Nghề nghiệp</div><div class="ds-input"><span>Sinh viên</span><span class="ds-ico">▾</span></div></div><div data-node-id="ta_bio" data-node-type="Textarea" class="ds-field"><div class="ds-label">Giới thiệu</div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div><div data-node-id="profile_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_save" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Lưu thay đổi</span></div></form></div></div></body></html>
