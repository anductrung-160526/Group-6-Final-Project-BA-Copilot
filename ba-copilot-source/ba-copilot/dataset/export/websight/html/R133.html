<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cập nhật thông tin giao hàng đơn của tôi – nhiều phần</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:#fff}</style></head>
<body><div data-node-id="page" data-node-type="Page" class="ds-page"><header data-node-id="top_header" data-node-type="Header" class="ds-header"><div class="ds-header-kids"><h1 data-node-id="title_order" data-node-type="Heading" class="ds-h ds-h1">Cập nhật đơn DH-10231</h1><span data-node-id="btn_back" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Đơn của tôi</span></div></header><form data-node-id="order_form" data-node-type="Form" class="ds-form"><section data-node-id="sec_receiver" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Người nhận</h3><div data-node-id="receiver_row" data-node-type="Row" class="ds-row ds-align-start" style="gap:8px"><div data-node-id="input_name" data-node-type="Input" class="ds-field"><div class="ds-label">Họ tên<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div><div data-node-id="input_phone" data-node-type="Input" class="ds-field"><div class="ds-label">Số điện thoại<span class="ds-req">*</span></div><div class="ds-input"><span class="ds-ph"></span></div></div></div></section><section data-node-id="sec_address" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Địa chỉ giao</h3><div data-node-id="ta_address" data-node-type="Textarea" class="ds-field"><div class="ds-label">Địa chỉ<span class="ds-req">*</span></div><div class="ds-input ds-textarea"><span class="ds-ph"></span></div></div><div data-node-id="select_district" data-node-type="Select" class="ds-field"><div class="ds-label">Quận/Huyện<span class="ds-req">*</span></div><div class="ds-input"><span>Quận 1</span><span class="ds-ico">▾</span></div></div></section><section data-node-id="sec_time" data-node-type="Section" class="ds-section"><h3 class="ds-section-title">Thời gian giao</h3><div data-node-id="date_delivery" data-node-type="DatePicker" class="ds-field"><div class="ds-label">Ngày giao mong muốn</div><div class="ds-input"><span class="ds-ph">dd/mm/yyyy</span><span class="ds-ico">▦</span></div></div><div data-node-id="radio_slot" data-node-type="Radio" class="ds-field"><div class="ds-label">Khung giờ</div><div class="ds-radios"><span class="ds-check"><span class="ds-radio on"></span>Sáng</span><span class="ds-check"><span class="ds-radio "></span>Chiều</span><span class="ds-check"><span class="ds-radio "></span>Tối</span></div></div></section><div data-node-id="form_actions" data-node-type="Row" class="ds-row ds-align-end" style="gap:8px"><span data-node-id="btn_cancel" data-node-type="Button" role="button" class="ds-btn ds-btn-secondary">Hủy</span><span data-node-id="btn_save" data-node-type="Button" role="button" class="ds-btn ds-btn-primary">Lưu thay đổi</span></div></form></div></body></html>
